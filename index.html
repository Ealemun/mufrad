<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover : sur iPhone, donne la hauteur de la barre de geste en bas (utilisée dans css/app.css) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mufrad</title>
<meta name="description" content="Réviser le vocabulaire arabe leçon par leçon, un peu chaque jour.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<!-- Installation sur l'écran d'accueil du téléphone -->
<link rel="manifest" href="manifest.webmanifest">
<!-- Couleur de la barre du navigateur, accordée au thème clair ou sombre -->
<meta name="theme-color" content="#f3eee2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1230" media="(prefers-color-scheme: dark)">
<!-- Icône d'onglet : vectorielle, avec une copie PNG pour les navigateurs qui ne lisent pas le SVG -->
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icone-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mufrad">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/grammaire.css">
</head>
<body>
<div class="app">
  <header id="top"></header>
  <main id="view"></main>
  <footer class="foot" id="foot"></footer>
</div>
<!-- Bibliothèque de la base de données (comptes, partage des voix). Sans réseau, l'application s'en passe. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<!-- Contenu : l'alphabet, puis un fichier par unité, puis l'assemblage ; l'application vient en dernier -->
<script src="js/contenu.js"></script>
<script src="js/unites/unite-01.js"></script>
<script src="js/unites/unite-02.js"></script>
<script src="js/unites/unite-03.js"></script>
<script src="js/unites/unite-04.js"></script>
<script src="js/unites/unite-05.js"></script>
<script src="js/unites/unite-06.js"></script>
<script src="js/assemblage.js"></script>
<!-- Grammaire : le moteur, le poème, puis un fichier par chapitre -->
<script src="js/grammaire.js"></script>
<script src="js/grammaire/glossaire.js"></script>
<script src="js/grammaire/nazm.js"></script>
<script src="js/grammaire/chapitre-01.js"></script>
<script src="js/app.js"></script>
</body>
</html>
